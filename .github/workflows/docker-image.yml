name: Docker image CI/CD

# La infraestructura tiene su propio pipeline (terraform.yml); la
# imagen se reconstruye con cualquier otro cambio del repositorio.
# En los PR solo corren el lint y el escaneo del Dockerfile; la
# imagen se construye, escanea y publica al hacer merge a main.
on:
  push:
    branches:
      - main
    paths-ignore:
      - "terraform/**"
      - ".github/workflows/terraform.yml"
  pull_request:
    branches:
      - main
    paths-ignore:
      - "terraform/**"
      - ".github/workflows/terraform.yml"

concurrency:
  group: "${{ github.workflow }}-${{ github.head_ref || github.run_id }}"
  cancel-in-progress: true

permissions: {}

jobs:
  lint:
    name: Lint Dockerfile & Compose manifest
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Lint Dockerfile (hadolint)
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387
        with:
          dockerfile: docker/Dockerfile
          failure-threshold: warning
      - name: Validation del docker-compose.yml
        run: docker compose -f docker-compose.yml config --quiet

  scan-config:
    name: Scan Dockerfile for misconfigurations (Trivy)
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Scan with Trivy
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        with:
          scan-type: fs
          scan-ref: docker
          scanners: misconfig,secret
          format: sarif
          output: trivy-dockerfile-results.sarif
          severity: CRITICAL,HIGH
          exit-code: '1'
          limit-severities-for-sarif: 'true'
      - name: Upload Trivy results to Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd
        with:
          sarif_file: trivy-dockerfile-results.sarif
          category: trivy-dockerfile

  build:
    name: Build container image
    needs: [lint, scan-config]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      image_tags: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: ./docker
          push: false
          # Sin esto el Dockerfile clona el tag 12.3 de Zulip y la imagen
          # no incluye los cambios de este repositorio.
          build-args: |
            ZULIP_GIT_REF=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=docker,dest=/tmp/image.tar
      - name: Upload image artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: zulip-image
          path: /tmp/image.tar
          retention-days: 7

  scan:
    name: Scan image for vulnerabilities (Trivy)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: zulip-image
          path: /tmp
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        with:
          scan-type: image
          input: /tmp/image.tar
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: '0'
      - name: Upload Trivy results to Security tab
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd
        with:
          sarif_file: trivy-results.sarif

  push:
    name: Publish image to GHCR
    needs: [build, scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: zulip-image
          path: /tmp
      - name: Load image into Docker
        run: docker load --input /tmp/image.tar
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push image tags
        env:
          IMAGE_TAGS: ${{ needs.build.outputs.image_tags }}
        run: |
          while IFS= read -r tag; do
            [ -n "$tag" ] && docker push "$tag"
          done <<< "$IMAGE_TAGS"


  # Las imágenes van fijadas en Terraform: en vez de desplegar aquí,
  # se abre un PR que cambia images.zulip al tag recién publicado.
  # Al hacer merge, terraform.yml lo aplica tras aprobar "production".
  deploy-pr:
    name: Open PR to deploy the new image
    needs: [build, push]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        # Necesita credenciales para subir la rama del PR.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # zizmor: ignore[artipacked]
      - name: Point images.zulip at the new tag
        id: bump
        env:
          IMAGE_TAGS: ${{ needs.build.outputs.image_tags }}
        run: |
          image=$(grep ':sha-' <<< "$IMAGE_TAGS" | head -n 1)
          tag=${image##*:}
          sed -E -i "s#(zulip +=) \"ghcr\.io/[^\"]+\"#\1 \"$image\"#" terraform/variables.tf
          if git diff --quiet; then
            echo "terraform/variables.tf already uses $image"
            exit 0
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Open pull request
        if: steps.bump.outputs.image != ''
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ steps.bump.outputs.image }}
          TAG: ${{ steps.bump.outputs.tag }}
        run: |
          branch="deploy/zulip-$TAG"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -am "deploy: Zulip $TAG"
          git push origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "deploy: Zulip $TAG" \
            --body "Actualiza \`images.zulip\` a \`$IMAGE\`, publicada por Docker image CI/CD. Al hacer merge, Terraform CI/CD la despliega tras aprobar el Environment \`production\`; Zulip se reinicia una vez."
