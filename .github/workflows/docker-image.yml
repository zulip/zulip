name: Docker image CI/CD

# La infraestructura tiene su propio pipeline (terraform.yml). La imagen
# no se reconstruye si un cambio solo toca lo que no afecta a Zulip en
# producción: infraestructura, documentación, pruebas y configuración
# del repositorio. "*.md" cubre solo la raíz; zerver y templates tienen
# Markdown que sí se usa.
# En los PR solo corren el lint y el escaneo del Dockerfile; al hacer
# merge a main, la imagen se construye, escanea, publica y despliega.
on:
  push:
    branches:
      - main
    paths-ignore:
      - "terraform/**"
      - "observability/**"
      - "docs/**"
      - "zerver/tests/**"
      - "corporate/tests/**"
      - "puppet/kandra/**"
      - ".claude/**"
      - ".vscode/**"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/FUNDING.yml"
      - ".github/funding.json"
      - ".github/pull_request_template.md"
      - ".github/workflows/api-docs-update-check.yml"
      - ".github/workflows/auto-add-parent-label.yml"
      - ".github/workflows/codeql-analysis.yml"
      - ".github/workflows/production-suite.yml"
      - ".github/workflows/terraform.yml"
      - ".github/workflows/update-oneclick-apps.yml"
      - ".github/workflows/zizmor.yml"
      - ".github/workflows/zulip-ci.yml"
      - ".github/workflows/zulip-cloud-deploy.yaml"
      - "*.md"
      - "LICENSE"
      - "NOTICE"
      - "Vagrantfile"
      - "Dockerfile-postgresql"
      - ".codecov.yml"
      - ".codespellignore"
      - ".devcontainer.json"
      - ".editorconfig"
      - ".env.example"
      - ".gitlint"
      - ".mailmap"
      - ".readthedocs.yaml"
      - ".sonarcloud.properties"
  pull_request:
    branches:
      - main
    paths-ignore:
      - "terraform/**"
      - "observability/**"
      - "docs/**"
      - "zerver/tests/**"
      - "corporate/tests/**"
      - "puppet/kandra/**"
      - ".claude/**"
      - ".vscode/**"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/FUNDING.yml"
      - ".github/funding.json"
      - ".github/pull_request_template.md"
      - ".github/workflows/api-docs-update-check.yml"
      - ".github/workflows/auto-add-parent-label.yml"
      - ".github/workflows/codeql-analysis.yml"
      - ".github/workflows/production-suite.yml"
      - ".github/workflows/terraform.yml"
      - ".github/workflows/update-oneclick-apps.yml"
      - ".github/workflows/zizmor.yml"
      - ".github/workflows/zulip-ci.yml"
      - ".github/workflows/zulip-cloud-deploy.yaml"
      - "*.md"
      - "LICENSE"
      - "NOTICE"
      - "Vagrantfile"
      - "Dockerfile-postgresql"
      - ".codecov.yml"
      - ".codespellignore"
      - ".devcontainer.json"
      - ".editorconfig"
      - ".env.example"
      - ".gitlint"
      - ".mailmap"
      - ".readthedocs.yaml"
      - ".sonarcloud.properties"

concurrency:
  group: "${{ github.workflow }}-${{ github.head_ref || github.run_id }}"
  cancel-in-progress: true

permissions: {}

jobs:
  lint:
    name: Lint Dockerfile & Compose manifest
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Lint Dockerfile (hadolint)
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387
        with:
          dockerfile: docker/Dockerfile
          failure-threshold: warning
      - name: Validation del docker-compose.yml
        run: docker compose -f docker-compose.yml config --quiet

  scan-config:
    name: Scan Dockerfile for misconfigurations (Trivy)
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Scan with Trivy
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        with:
          scan-type: fs
          scan-ref: docker
          scanners: misconfig,secret
          format: sarif
          output: trivy-dockerfile-results.sarif
          severity: CRITICAL,HIGH
          exit-code: '1'
          limit-severities-for-sarif: 'true'
      - name: Upload Trivy results to Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd
        with:
          sarif_file: trivy-dockerfile-results.sarif
          category: trivy-dockerfile

  build:
    name: Build container image
    needs: [lint, scan-config]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      image_tags: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: ./docker
          push: false
          # Sin esto el Dockerfile clona el tag 12.3 de Zulip y la imagen
          # no incluye los cambios de este repositorio.
          build-args: |
            ZULIP_GIT_REF=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=docker,dest=/tmp/image.tar
      - name: Upload image artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: zulip-image
          path: /tmp/image.tar
          retention-days: 7

  scan:
    name: Scan image for vulnerabilities (Trivy)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: zulip-image
          path: /tmp
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        with:
          scan-type: image
          input: /tmp/image.tar
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: '0'
      - name: Upload Trivy results to Security tab
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd
        with:
          sarif_file: trivy-results.sarif

  push:
    name: Publish image to GHCR
    needs: [build, scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: zulip-image
          path: /tmp
      - name: Load image into Docker
        run: docker load --input /tmp/image.tar
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push image tags
        env:
          IMAGE_TAGS: ${{ needs.build.outputs.image_tags }}
        run: |
          while IFS= read -r tag; do
            [ -n "$tag" ] && docker push "$tag"
          done <<< "$IMAGE_TAGS"


  # Las imágenes van fijadas en Terraform: el tag recién publicado se
  # escribe en main para que el código siga describiendo lo desplegado.
  # Un push hecho con GITHUB_TOKEN no dispara otros workflows, así que
  # este commit no vuelve a construir la imagen ni repite el apply.
  update-image:
    name: Point Terraform at the new image
    needs: [build, push]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      deploy: ${{ steps.bump.outputs.deploy }}
    steps:
      - name: Checkout repository
        # Necesita credenciales para subir el commit, y el historial
        # (sin blobs) para comparar commits.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # zizmor: ignore[artipacked]
        with:
          ref: main
          fetch-depth: 0
          filter: blob:none
      - name: Commit the new tag to main
        id: bump
        env:
          IMAGE_TAGS: ${{ needs.build.outputs.image_tags }}
        run: |
          image=$(grep ':sha-' <<< "$IMAGE_TAGS" | head -n 1)
          tag=${image##*:}
          # Si un merge posterior terminó antes, esta imagen es más vieja
          # que la desplegada y publicarla sería un rollback.
          current=$(sed -nE 's#^ *zulip +=.*:sha-([0-9a-f]+)".*#\1#p' terraform/variables.tf)
          if [ -n "$current" ] && git merge-base --is-ancestor "$GITHUB_SHA" "$current"; then
            if [ "$(git rev-parse "$current")" != "$GITHUB_SHA" ]; then
              echo "::notice::main already deploys sha-$current, newer than $tag"
              echo "deploy=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "deploy=true" >> "$GITHUB_OUTPUT"
          sed -E -i "s#(zulip +=) \"ghcr\.io/[^\"]+\"#\1 \"$image\"#" terraform/variables.tf
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "deploy: Zulip $tag"
          # Otro merge puede haber llegado a main mientras tanto.
          for attempt in 1 2 3; do
            git push origin HEAD:main && exit 0
            sleep $((attempt * 5))
            git pull --rebase origin main
          done
          exit 1

  # Mismos pasos y grupo de concurrencia que el apply de terraform.yml:
  # los dos pipelines escriben el mismo estado y deben hacerlo en cola.
  deploy:
    name: Deploy with Terraform
    needs: update-image
    if: needs.update-image.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: terraform-apply
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      TF_VAR_zulip_email_password: ${{ secrets.ZULIP_EMAIL_PASSWORD }}
      TF_VAR_zulip_administrator: ${{ secrets.ZULIP_ADMINISTRATOR }}
      TF_VAR_authorized_networks: ${{ secrets.AUTHORIZED_NETWORKS }}
      TF_VAR_zulip_email_host_user: ${{ secrets.ZULIP_EMAIL_HOST_USER }}
    steps:
      - name: Checkout repository
        # main, no el commit que disparó el pipeline: ese no tiene el tag
        # nuevo, y aplicarlo revertiría lo que se haya mergeado después.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
      - name: Authenticate to Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_wrapper: false
      - name: Write terraform.tfvars
        working-directory: terraform
        env:
          TERRAFORM_TFVARS: ${{ vars.TERRAFORM_TFVARS }}
        run: printf '%s\n' "$TERRAFORM_TFVARS" > terraform.tfvars
      - name: Terraform init
        working-directory: terraform
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: terraform init -input=false -backend-config="bucket=$TF_STATE_BUCKET"
      - name: Terraform apply
        working-directory: terraform
        run: terraform apply -input=false -lock-timeout=5m -auto-approve
